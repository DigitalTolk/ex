# Generates TypeScript mirrors of the Go wire types (json tags) so the
# frontend can compile-time-check its hand-written interfaces against the
# backend's actual shapes. Regenerate with `make types`; `make check` fails
# if the committed file drifts from the model package.
packages:
  - path: "github.com/DigitalTolk/ex/internal/model"
    output_path: "src/types/generated.ts"
    # hast.go is excluded: HastNode has a custom MarshalJSON (children
    # omitted on text nodes) that tygo cannot see, so the hand-written
    # HastNode in index.ts is the accurate wire shape — generated types
    # reference it via the frontmatter import below.
    exclude_files:
      - "hast.go"
    frontmatter: |
      // Code generated by tygo from internal/model — DO NOT EDIT.
      // Regenerate: make types
      /* eslint-disable */
      import type { HastNode } from "./index";
    type_mappings:
      time.Time: "string /* RFC3339 */"
