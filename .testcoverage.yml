# Backend coverage gate (replaces the awk total-check in the Makefile).
#
# Uses github.com/vladopajic/go-test-coverage. The profile is produced by
# `go test -tags=integration -coverprofile=coverage.out ./internal/...`.
#
# The gate is 100%: every statement in ./internal/... is exercised by tests.
# There are NO `// coverage-ignore` annotations left — statically-impossible
# error arms are either covered through fault-injection seams (see
# internal/store/fault_test.go, the cmdFailHook Redis hooks, the randRead /
# webpEncode seams) or refactored into must-* panic helpers with direct panic
# tests; provably-dead guards were deleted. Keep it that way: new code ships
# with tests that reach every statement, and the annotation escape hatch stays
# closed (force-annotation-comment would still demand a written reason, but
# the expectation is zero annotations). See COVERAGE.md for the policy.
profile: coverage.out

# If a `// coverage-ignore` ever reappears it MUST carry an explanation — but
# the standing policy is that none exist at all.
force-annotation-comment: true

threshold:
  # Statement coverage. 100 — no skipped lines.
  total: 100

exclude:
  paths:
    # Process entrypoint / DI wiring — exercised by the binary, not unit tests.
    - ^cmd/server/main\.go$
