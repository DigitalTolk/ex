services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    user: root
    ports:
      - "28000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /data"
    volumes:
      - dynamodb-data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8000' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    # No host port published — the app reaches it as `redis:6379` on
    # the internal network. Keeps host :6379 free for coexistence.
    # Enable AOF and persist /data to a named volume so the per-user inbox
    # streams (WS replay-on-reconnect) survive a container restart instead of
    # every client falling back to a full refetch.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    # Remapped off the default 9000/9001 so this stack can run beside
    # other local MinIO stacks. The browser hits MinIO directly via
    # presigned URLs, so S3_PUBLIC_ENDPOINT below must match the host
    # port published here (29000).
    ports:
      - "29000:9000"
      - "29001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Allow browser uploads via presigned URLs from any origin in dev
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    environment:
      discovery.type: single-node
      # Dev: security plugin off so the API is plain HTTP on :9200.
      # Production should re-enable it via a sidecar config / TLS
      # bundle and switch the URL scheme to https.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      # Quiet down the default INFO-level chatter — the dev console
      # was getting buried under cluster-state, GC, and shard
      # bookkeeping logs from a single-node setup that nobody is
      # operating. WARN keeps real problems visible.
      logger.level: WARN
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Local SSO (Dex) so the dev stack can be signed into without a real
  # identity provider. Test users + password live in dev/dex.yaml.
  #
  # `app` joins this container's network namespace (network_mode below) so
  # the OIDC issuer http://localhost:5556/dex is the SAME URL for the browser
  # and for the app's server-side discovery/token calls. Consequences:
  #   - the app's port (8500) is published here, not on `app`;
  #   - the `app` alias makes http://app:8500 (used by the Vite service in
  #     docker-compose.dev.yml) keep resolving;
  #   - extra_hosts for the app must live here too.
  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dev/dex.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"   # Dex (OIDC issuer http://localhost:5556/dex)
      - "8500:8500"   # app (network_mode: service:dex)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - app

  app:
    build:
      context: .
      # Always rebuild the image from scratch on `docker compose up --build`, so
      # a cached `npm run build` layer can never embed a stale frontend bundle
      # into the Go binary (the SPA is baked in via go:embed at build time — the
      # #1 cause of "I deployed but the sidebar still runs old JS"). This forces
      # a fresh frontend + Go compile every time; the Dockerfile's BuildKit
      # `--mount=type=cache` mounts survive `--no-cache`, so npm/go downloads and
      # the Go build cache are reused and the fresh rebuild stays fast.
      no_cache: true
      args:
        # VERSION must be a unique-per-deploy identifier (git sha or
        # release tag) so the upgrade banner fires on tabs left open
        # across rebuilds. The Makefile sets this from `git rev-parse
        # --short HEAD` before `docker compose up`; CI should set it
        # explicitly. Defaults to "dev" — banner stays silent.
        VERSION: ${VERSION:-dev}
    # Shares Dex's network namespace — see the `dex` service above.
    network_mode: service:dex
    restart: on-failure
    # Optional: a fresh checkout has no .env, and compose treats a missing
    # env_file as a hard error — which blocked `make dev` / `make dev-watch`
    # before any container started. Everything the local stack needs is set
    # below; .env is only for the optional integrations (SSO, SMTP, Giphy).
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8500"
      ENV: development
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE: exdb
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      BASE_URL: http://localhost:8500
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:29000
      S3_BUCKET: ex-avatars
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      OPENSEARCH_URL: http://opensearch:9200
      # Local Dex SSO by default; set these in .env to use a real provider.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:5556/dex}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-ex-local}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-ex-local-secret}
      # Optional: point ex at a running connector-provider to pull its connector
      # catalog. Off by default. To test locally, run a provider on the host and
      # set these (host.docker.internal reaches the host from the container):
      #   CONNECTOR_PROVIDER_URL: http://host.docker.internal:8600
      #   CONNECTOR_PROVIDER_API_KEY: <the provider's PROVIDER_API_KEY>
    # extra_hosts (host.docker.internal) is set on `dex`: Docker rejects
    # host mappings on a container that joins another's network namespace.
    depends_on:
      dex:
        condition: service_started
      dynamodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy

volumes:
  dynamodb-data:
  redis-data:
  minio-data:
  opensearch-data:
