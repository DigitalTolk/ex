# Local-only OIDC provider (Dex) for `docker compose up`.
# Lets you sign in to the dev stack without a real SSO tenant.
# NEVER use this config outside local development.
#
# The issuer is http://localhost:5556/dex for BOTH the browser and the app:
# the `app` service shares this container's network namespace
# (network_mode: service:dex), so "localhost:5556" resolves to Dex from
# inside the app container too — no hostname tricks or /etc/hosts edits.
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true

staticClients:
  - id: ex-local
    name: Ex (local dev)
    secret: ex-local-secret
    redirectURIs:
      - http://localhost:8500/auth/oidc/callback   # make dev
      - http://localhost:5173/auth/oidc/callback   # make dev-watch (Vite)

enablePasswordDB: true

# Same accounts as the seed script (cmd/seed, `make seed`), so SSO and the
# password form land on the same users. Password for all: "password123".
# Alice is the seeded admin; on a fresh, unseeded stack the first user to
# sign in via SSO is promoted to admin.
staticPasswords:
  - email: alice@example.com
    username: Alice
    userID: 00000000-0000-0000-0000-000000000001
    hash: "$2a$10$BiLBlmahiELnvCwY7nerzOcwtELrwiGCfSsSBoTa86GRp3VZgILYm"
  - email: bob@example.com
    username: Bob
    userID: 00000000-0000-0000-0000-000000000002
    hash: "$2a$10$BiLBlmahiELnvCwY7nerzOcwtELrwiGCfSsSBoTa86GRp3VZgILYm"
  - email: carol@example.com
    username: Carol
    userID: 00000000-0000-0000-0000-000000000003
    hash: "$2a$10$BiLBlmahiELnvCwY7nerzOcwtELrwiGCfSsSBoTa86GRp3VZgILYm"
