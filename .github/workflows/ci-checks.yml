name: CI Checks

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: '1.26.4'
  NODE_VERSION: '24'

jobs:
  # Lint runs first and fails fast — no point spinning up the test
  # containers, building images, or publishing coverage if the code doesn't
  # even pass static checks.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Frontend deps
        run: npm ci

      - name: Wire-type drift (tygo)
        run: make check-types-drift

      - name: CLAUDE.md content gate (technical guidance only)
        run: make check-claude-md

      - name: ESLint
        run: npx eslint src/

      - name: TypeScript type-check
        # `-b` is required: a project-references root tsconfig ignores
        # `references` unless --build is set, so plain `tsc -p` checks
        # nothing (same reasoning as the Makefile's tsc step).
        run: npx tsc -b --noEmit

  test-backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go test with coverage (testcontainers)
        run: |
          go test -tags=integration -coverprofile=coverage.out -covermode=atomic ./internal/...
          go tool cover -func=coverage.out | tail -1

      - name: Enforce backend coverage gate (= 100% statements)
        # Uses go-test-coverage so the gate honors the `// coverage-ignore`
        # annotations on irreducible defensive code (see COVERAGE.md). The raw
        # `go tool cover` total does NOT honor them, so it must not gate here —
        # this mirrors the Makefile's `check` target exactly.
        run: go run github.com/vladopajic/go-test-coverage/v2@v2.18.8 --config=.testcoverage.yml

      - name: Upload backend coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
          format: golang
          flag-name: backend
          parallel: true
          github-token: ${{ github.token }}

  test-frontend:
    # The jsdom + browser vitest projects, split across four runners. One
    # runner running all ~1000 files (jsdom plus three Playwright browsers)
    # was saturated, and tests that pass on an idle machine timed out or
    # raced under that load. Each shard writes a blob report; the merge job
    # below applies the 100% gate to the MERGED coverage, so a shard's own
    # (partial) coverage is not gated. Runs in the playwright container
    # because the browser projects need its browsers.
    name: Frontend (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    container:
      # Tag must track the playwright-core version in package-lock.json —
      # vitest launches the browsers this image pre-installs, and a mismatch
      # fails with "Executable doesn't exist".
      image: ghcr.io/digitaltolk/docker-builder-playwright:1.61.1
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Frontend deps
        run: npm ci

      - name: Run vitest shard
        # Thresholds off (the merge job gates), console output fails the
        # shard, and a shard whose browser died runs once more.
        run: node scripts/test-frontend.mjs --shards 4 --only ${{ matrix.shard }}

      - name: Upload blob report
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  frontend-coverage:
    # Merges the shards' reports into the one coverage report the 100% gate
    # (vitest.config.ts thresholds) and the universe check apply to.
    name: Frontend coverage
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/digitaltolk/docker-builder-playwright:1.61.1
    needs: test-frontend
    steps:
      - uses: actions/checkout@v7

      - name: Frontend deps
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true

      - name: Merge reports with coverage (100% gate)
        run: npx vitest --mergeReports --coverage

      - name: Coverage universe (no file silently ungraded)
        run: node scripts/check-coverage-universe.mjs

      - name: Upload frontend coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          flag-name: frontend
          parallel: true
          base-path: .
          github-token: ${{ github.token }}

  flake-gate:
    # The frontend tests a pull request touches, run several times over in a
    # shuffled order with runs side by side (scripts/check-flaky.mjs, also the
    # last step of `make check`): a test that passes once but fails under
    # load or in another order is stopped before it reaches main.
    name: Flake gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/digitaltolk/docker-builder-playwright:1.61.1
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Frontend deps
        run: npm ci

      - name: Touched tests, shuffled, under load
        run: node scripts/check-flaky.mjs --base origin/${{ github.base_ref }}

  coverage-finish:
    # Tells Coveralls that all parallel coverage uploads are done so it can
    # combine them into a single report.
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test-backend, frontend-coverage]
    if: always()
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: backend,frontend
          github-token: ${{ github.token }}
