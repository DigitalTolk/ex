name: CI Checks

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: '1.26.4'
  NODE_VERSION: '24'

jobs:
  # Lint runs first and fails fast — no point spinning up the test
  # containers, building images, or publishing coverage if the code doesn't
  # even pass static checks.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Frontend deps
        run: npm ci

      - name: Wire-type drift (tygo)
        run: make check-types-drift

      - name: ESLint
        run: npx eslint src/

      - name: TypeScript type-check
        run: npx tsc -p tsconfig.json --noEmit

  test-backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go test with coverage (testcontainers)
        run: |
          go test -tags=integration -coverprofile=coverage.out -covermode=atomic ./internal/...
          go tool cover -func=coverage.out | tail -1

      - name: Enforce backend coverage gate (= 100% statements)
        # Uses go-test-coverage so the gate honors the `// coverage-ignore`
        # annotations on irreducible defensive code (see COVERAGE.md). The raw
        # `go tool cover` total does NOT honor them, so it must not gate here —
        # this mirrors the Makefile's `check` target exactly.
        run: go run github.com/vladopajic/go-test-coverage/v2@v2.18.8 --config=.testcoverage.yml

      - name: Upload backend coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
          format: golang
          flag-name: backend
          parallel: true
          github-token: ${{ github.token }}

  test-frontend:
    # ONE frontend job: the jsdom + browser vitest projects run together so
    # the 100% coverage gate applies to the MERGED report (the per-suite
    # split no longer exists). Runs in the playwright container because the
    # browser projects need its browsers; jsdom runs fine there too.
    name: Frontend
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/digitaltolk/docker-builder-playwright:1.59.1
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Frontend deps
        run: npm ci

      - name: Run vitest (all projects) with merged coverage
        run: npx vitest run --coverage

      - name: Coverage universe (no file silently ungraded)
        run: node scripts/check-coverage-universe.mjs

      - name: Upload frontend coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          flag-name: frontend
          parallel: true
          base-path: .
          github-token: ${{ github.token }}

  coverage-finish:
    # Tells Coveralls that all parallel coverage uploads are done so it can
    # combine them into a single report.
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: always()
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: backend,frontend
          github-token: ${{ github.token }}
