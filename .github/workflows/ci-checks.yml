name: CI Checks

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: '1.26.4'
  NODE_VERSION: '24'

jobs:
  # Lint runs first and fails fast — no point spinning up the test
  # containers, building images, or publishing coverage if the code doesn't
  # even pass static checks.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Frontend deps
        run: npm ci

      - name: Wire-type drift (tygo)
        run: make check-types-drift

      - name: ESLint
        run: npx eslint src/

      - name: TypeScript type-check
        # `-b` is required: a project-references root tsconfig ignores
        # `references` unless --build is set, so plain `tsc -p` checks
        # nothing (same reasoning as the Makefile's tsc step).
        run: npx tsc -b --noEmit

  test-backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go test with coverage (testcontainers)
        run: |
          go test -tags=integration -coverprofile=coverage.out -covermode=atomic ./internal/...
          go tool cover -func=coverage.out | tail -1

      - name: Enforce backend coverage gate (= 100% statements)
        # Uses go-test-coverage so the gate honors the `// coverage-ignore`
        # annotations on irreducible defensive code (see COVERAGE.md). The raw
        # `go tool cover` total does NOT honor them, so it must not gate here —
        # this mirrors the Makefile's `check` target exactly.
        run: go run github.com/vladopajic/go-test-coverage/v2@v2.18.8 --config=.testcoverage.yml

      - name: Upload backend coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
          format: golang
          flag-name: backend
          parallel: true
          github-token: ${{ github.token }}

  test-frontend:
    # One job PER vitest project. They used to share a runner, where the four
    # projects each ran files in parallel (maxWorkers is per project) and
    # oversubscribed a 4-vCPU runner: assertions fired before their async work
    # finished, jsdom tore down under a live File, and Playwright could not
    # close a browser inside 10s. Splitting gives each project its own runner
    # and, as a bonus, runs them at the same time.
    #
    # Each project writes a BLOB report; `test-frontend-coverage` merges them
    # so the 100% gate still applies to the union, exactly as one run did.
    # Per-project thresholds are switched off here because no single project
    # covers everything — the merged report is the gate.
    name: Frontend (${{ matrix.project }})
    runs-on: ubuntu-latest
    container:
      # Tag must track the playwright-core version in package-lock.json —
      # vitest launches the browsers this image pre-installs, and a mismatch
      # fails with "Executable doesn't exist".
      image: ghcr.io/digitaltolk/docker-builder-playwright:1.61.1
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        project: [jsdom, chromium-desktop, chromium-mobile, webkit-iphone]
    steps:
      - uses: actions/checkout@v7

      - name: Frontend deps
        run: npm ci

      - name: Run vitest (${{ matrix.project }})
        run: >
          npx vitest run --project ${{ matrix.project }}
          --reporter=blob --outputFile=.vitest-reports/${{ matrix.project }}.json
          --coverage
          --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.lines=0

      - name: Keep the blob report for the merge
        uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.project }}
          path: .vitest-reports/${{ matrix.project }}.json
          retention-days: 1
          if-no-files-found: error

  test-frontend-coverage:
    # The gate: merge every project's blob report and apply the thresholds to
    # the union. `--merge-reports` re-runs nothing, so this is quick.
    name: Frontend coverage
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/digitaltolk/docker-builder-playwright:1.61.1
    needs: test-frontend
    steps:
      - uses: actions/checkout@v7

      - name: Frontend deps
        run: npm ci

      - name: Collect the projects' blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true

      - name: Merge reports and enforce the coverage gate
        run: npx vitest --merge-reports=.vitest-reports --coverage

      - name: Coverage universe (no file silently ungraded)
        run: node scripts/check-coverage-universe.mjs

      - name: Upload frontend coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          flag-name: frontend
          parallel: true
          base-path: .
          github-token: ${{ github.token }}

  coverage-finish:
    # Tells Coveralls that all parallel coverage uploads are done so it can
    # combine them into a single report.
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend-coverage]
    if: always()
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: backend,frontend
          github-token: ${{ github.token }}
