name: CI Checks

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: '1.26.4'
  NODE_VERSION: '24'

jobs:
  # Lint runs first and fails fast — no point spinning up the test
  # containers, building images, or publishing coverage if the code doesn't
  # even pass static checks.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --timeout=5m

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Frontend deps
        run: npm ci

      - name: Wire-type drift (tygo)
        run: make check-types-drift

      - name: CLAUDE.md content gate (technical guidance only)
        run: make check-claude-md

      - name: ESLint
        run: npx eslint src/

      - name: TypeScript type-check
        # `-b` is required: a project-references root tsconfig ignores
        # `references` unless --build is set, so plain `tsc -p` checks
        # nothing (same reasoning as the Makefile's tsc step).
        run: npx tsc -b --noEmit

  test-backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go test with coverage (testcontainers)
        run: |
          go test -tags=integration -coverprofile=coverage.out -covermode=atomic ./internal/... ./pkg/...
          go tool cover -func=coverage.out | tail -1

      - name: Enforce backend coverage gate (= 100% statements)
        # Uses go-test-coverage so the gate honors the `// coverage-ignore`
        # annotations on irreducible defensive code (see COVERAGE.md). The raw
        # `go tool cover` total does NOT honor them, so it must not gate here —
        # this mirrors the Makefile's `check` target exactly.
        run: go run github.com/vladopajic/go-test-coverage/v2@v2.18.8 --config=.testcoverage.yml

      - name: Upload backend coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.out
          format: golang
          flag-name: backend
          parallel: true
          github-token: ${{ github.token }}

  test-frontend:
    # ONE frontend job: the jsdom + browser vitest projects run together so
    # the 100% coverage gate applies to the MERGED report (the per-suite
    # split no longer exists). Runs in the playwright container because the
    # browser projects need its browsers; jsdom runs fine there too.
    name: Frontend
    runs-on: ubuntu-latest
    container:
      # Tag must track the playwright-core version in package-lock.json —
      # vitest launches the browsers this image pre-installs, and a mismatch
      # fails with "Executable doesn't exist".
      image: ghcr.io/digitaltolk/docker-builder-playwright:1.61.1
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Frontend deps
        run: npm ci

      - name: Run vitest (all projects) with merged coverage
        run: npx vitest run --coverage

      - name: Coverage universe (no file silently ungraded)
        run: node scripts/check-coverage-universe.mjs

      - name: Upload frontend coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage/lcov.info
          flag-name: frontend
          parallel: true
          base-path: .
          github-token: ${{ github.token }}

  coverage-finish:
    # Tells Coveralls that all parallel coverage uploads are done so it can
    # combine them into a single report.
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: always()
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel-finished: true
          carryforward: backend,frontend
          github-token: ${{ github.token }}
