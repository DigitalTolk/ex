name: Docker Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # Build-only Docker validation for PRs and main. Release image publishing is
  # tag-only in docker-publish.yml, so this workflow deliberately has no tag
  # trigger instead of using job-level skips.
  docker-build:
    uses: ./.github/workflows/docker-build-shards.yml
    with:
      cache-prefix: ''
