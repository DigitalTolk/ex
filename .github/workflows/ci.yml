name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME is computed inside each Docker job because GHCR rejects
  # mixed-case repository paths and there's no expression-level lowercase
  # in GitHub Actions. ${{ github.repository }} preserves the configured
  # case (e.g. DigitalTolk/ex) so we lowercase it via tr in setup steps.
  GO_VERSION: '1.26.2'
  NODE_VERSION: '24'

jobs:
  # Lint runs first and fails fast — no point spinning up the test
  # containers, building images, or publishing coverage if the code doesn't
  # even pass static checks.
  lint:
    name: Lint (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npx eslint src/

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc -p tsconfig.json --noEmit

  test-backend:
    name: Backend tests + coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go test with coverage (testcontainers)
        run: |
          go test -tags=integration -coverprofile=coverage.out -covermode=atomic ./internal/...
          go tool cover -func=coverage.out | tail -1

      - name: Upload backend coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out
          format: golang
          flag-name: backend
          parallel: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test-frontend:
    name: Frontend tests + coverage
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/DigitalTolk/docker-builder-playwright:1.59.1
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run vitest with coverage
        working-directory: frontend
        run: npx vitest run --coverage

      - name: Run browser tests
        working-directory: frontend
        run: npm run test:browser:coverage

      - name: Upload frontend coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: frontend/coverage/lcov.info
          flag-name: frontend
          parallel: true
          base-path: frontend
          github-token: ${{ secrets.GITHUB_TOKEN }}

  coverage-finish:
    # Tells Coveralls that all parallel coverage uploads are done so it can
    # combine them into a single report.
    name: Finalize Coveralls
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: always()
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          carryforward: backend,frontend
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Multi-arch builds are split across two native runners (amd64 + arm64)
  # and merged into a single manifest at the end. Building each arch on
  # its own native runner avoids the slow QEMU emulation we used to do
  # on a single ubuntu-latest job — typical end-to-end build time drops
  # from 8–10 min to 2–3 min.
  #
  # Each per-arch job runs build-only so PRs and main pushes still gate
  # on Dockerfile correctness. Release publishing lives in
  # docker-publish.yml, which is tag-only so PRs do not show skipped
  # publish jobs.
  docker-build:
    name: Build (${{ matrix.arch }})
    needs: [test-backend, test-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push=false
          build-args: |
            GIT_TAG=
            GIT_SHA=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
