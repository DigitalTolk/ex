name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci-checks.yml

  docker-build:
    name: Docker
    needs: checks
    uses: ./.github/workflows/docker-build-shards.yml
    with:
      cache-prefix: ''
