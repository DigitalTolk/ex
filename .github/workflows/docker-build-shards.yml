name: Docker Build Shards

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      git-tag:
        type: string
        default: ''
      cache-prefix:
        type: string
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker-build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image
        if: ${{ !inputs.publish }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push=false
          build-args: |
            GIT_TAG=
            GIT_SHA=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ inputs['cache-prefix'] }}${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs['cache-prefix'] }}${{ matrix.arch }}

      - name: Build and push by digest
        if: inputs.publish
        id: publish-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          # Push by digest only; no tags here. The manifest job stitches
          # the digests together under the user-facing semver tags.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_TAG=${{ inputs['git-tag'] }}
            GIT_SHA=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ inputs['cache-prefix'] }}${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs['cache-prefix'] }}${{ matrix.arch }}

      # Ferry the digest to the manifest job via an artifact. Matrix
      # job outputs collapse to the last shard's value on GitHub
      # Actions, so an artifact-per-shard is the canonical workaround.
      - name: Stage digest for manifest job
        if: inputs.publish
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.publish-build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
