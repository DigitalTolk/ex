name: Docker Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci-checks.yml

  docker-build:
    needs: checks
    uses: ./.github/workflows/docker-build-shards.yml
    with:
      publish: true
      git-tag: ${{ github.ref_name }}
      cache-prefix: publish-

  docker-manifest:
    name: Publish multi-arch manifest
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Semver triplet on releases. We deliberately do NOT publish
          # per-commit sha tags because they bloat the GHCR package list.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          # Each downloaded artifact is an empty file named after its
          # digest hex (no "sha256:" prefix). Build one imagetools
          # create per metadata-action tag so they all point at the
          # same multi-arch manifest list.
          srcs=()
          for f in *; do
            srcs+=("${IMAGE}@sha256:${f}")
          done
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" "${srcs[@]}"
          done <<< "${{ steps.meta.outputs.tags }}"
