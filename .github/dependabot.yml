# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      - dependency-name: "node"
        versions:
          - ">=25.0.0"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      gomod:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # @types/node must track the Node runtime the app is pinned to
      # (package.json engines + the node:24 build stage), not npm's latest.
      - dependency-name: "@types/node"
        versions:
          - ">=25.0.0"
      # TypeScript stays on the 6.x line deliberately — 7.x is the native-port
      # compiler and is a breaking change for the type-check gate and for
      # typescript-eslint. Revisit as an intentional migration, not a bump.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0"
    groups:
      npm:
        patterns:
          - "*"
